<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff8225">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
  <title>Bhakti Naad — Admin Panel</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      overflow-y: auto;
      background: #0f0703;
      padding: 40px 20px;
    }
    .admin-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      background: rgba(20, 12, 8, 0.85);
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(255,255,255,.1);
      padding-bottom: 14px;
    }
    .admin-header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      color: #fff;
    }
    .back-link {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      border: 1px solid rgba(var(--accent-rgb), .3);
      padding: 6px 14px;
      border-radius: 999px;
      transition: all .2s;
    }
    .back-link:hover {
      background: rgba(var(--accent-rgb), .12);
      border-color: var(--accent);
    }
    .admin-form {
      display: grid;
      gap: 14px;
    }
    .form-group {
      display: grid;
      gap: 4px;
    }
    .form-group label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .admin-form input,
    .admin-form select,
    .admin-form textarea {
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.05);
      color: #fff;
      font-family: inherit;
    }
    .admin-form select option {
      background: #140c08;
      color: #fff;
    }
    .admin-form input:focus,
    .admin-form select:focus,
    .admin-form textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(var(--accent-rgb),.3);
    }
    .admin-submit-btn {
      padding: 12px;
      border-radius: 999px;
      background: var(--accent);
      color: #120703;
      font-weight: 700;
      border: none;
      cursor: pointer;
      margin-top: 6px;
      box-shadow: 0 4px 15px rgba(var(--accent-rgb),.35);
      transition: transform .2s;
    }
    .admin-submit-btn:hover {
      transform: scale(1.02);
    }
    .admin-submit-btn:active {
      transform: scale(.98);
    }
    .custom-songs-section {
      margin-top: 30px;
      border-top: 1px solid rgba(255,255,255,.12);
      padding-top: 20px;
    }
    .custom-songs-section h3 {
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 14px;
    }
    .custom-songs-list {
      display: grid;
      gap: 10px;
      max-height: 350px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .custom-song-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      margin-bottom: 8px;
      transition: all 0.2s ease;
    }
    .custom-song-item:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(var(--accent-rgb), 0.25);
    }
    .custom-song-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .custom-song-info b {
      font-size: 13px;
      color: #fff;
    }
    .custom-song-info small {
      font-size: 10px;
      letter-spacing: 0.05em;
    }
    .custom-song-delete-btn {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(230, 74, 25, 0.15);
      color: #ff5252;
      border: 1px solid rgba(255, 82, 82, 0.25);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1;
      padding: 0;
    }
    .custom-song-delete-btn:hover {
      background: rgba(255, 82, 82, 0.3);
      color: #fff;
      border-color: #ff5252;
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <h1>🛠️ Devotional Admin Panel</h1>
      <a href="index.html" class="back-link">Go to Player ↗</a>
    </div>

    <form id="addSongForm" class="admin-form">
      <div class="form-group">
        <label for="songDeity">Deity / भगवान</label>
        <select id="songDeity" required>
          <option value="ganesha">Ganesha (गणेशजी)</option>
          <option value="shiva">Shiva (शिवजी)</option>
          <option value="krishna">Krishna (कृष्णजी)</option>
          <option value="rama">Rama (रामजी)</option>
          <option value="hanuman">Hanuman (हनुमानजी)</option>
          <option value="durga">Durga (दुर्गा माँ)</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="songUrl">YouTube Link, Video ID, MP3 Link, or Local Path</label>
        <input type="text" id="songUrl" placeholder="e.g. https://youtube.com/... OR audio/mysong.mp3" required>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="form-group">
          <label for="songTitle">Full Song Title</label>
          <input type="text" id="songTitle" placeholder="e.g. Achyutam Keshavam · Rajshri Soul">
        </div>
        <div class="form-group">
          <label for="songShortName">Short Name</label>
          <input type="text" id="songShortName" placeholder="e.g. Achyutam">
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="form-group">
          <label for="songType">Type</label>
          <input type="text" id="songType" placeholder="e.g. Bhajan, Aarti, Chalisa">
        </div>
        <div class="form-group">
          <label for="songSubline">Subline Description</label>
          <input type="text" id="songSubline" placeholder="e.g. Soulful name chant">
        </div>
      </div>

      <div class="form-group">
        <label for="songLead">Significance / Description</label>
        <textarea id="songLead" rows="3" placeholder="Explain the spiritual significance of this song..."></textarea>
      </div>

      <button type="submit" class="admin-submit-btn">Add Song to Playlist</button>
    </form>

    <div class="custom-songs-section">
      <h3>Manage Playlist (Default & Custom Songs)</h3>
      <div class="custom-songs-list" id="customSongsList">
        <!-- Rendered by JS -->
      </div>
      <button type="button" id="exportBtn" class="admin-submit-btn" style="background: #2b6cb0; color: #fff; margin-top: 14px; box-shadow: 0 4px 15px rgba(43, 108, 176, 0.35); width: 100%;">Save Changes (Export to data.js)</button>
      <p style="font-size: 10px; color: var(--muted); margin-top: 8px; text-align: center; line-height: 1.4;">Clicking export will download an updated <b>data.js</b>. Overwrite it in your project folder, commit, and push to make your playlist changes live on Vercel!</p>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="admin.js"></script>
</body>
</html>
